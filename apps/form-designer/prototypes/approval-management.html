isplay:flex;align-items:center;gap:9px;width:100%;padding:11px 12px;border:0;background:transparent;color:var(--ap-text);border-radius:5px;text-align:left;margin:3px 0}#approval-prototype .ap-nav-btn.active{color:var(--ap-blue);background:var(--ap-soft);font-weight:600}#approval-prototype .ap-count{margin-left:auto;color:var(--ap-muted);font-size:12px}#approval-prototype .ap-side-note{display:flex;gap:8px;font-size:12px;color:var(--ap-muted);border-top:1px solid var(--ap-line);padding:16px 8px;margin-top:28px}#approval-prototype .ap-main{padding:24px;min-width:0;position:relative}#approval-prototype .ap-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}#approval-prototype .ap-eyebrow{color:var(--ap-muted);font-size:12px;margin-bottom:8px}#approval-prototype h2{font-size:22px;font-weight:600}#approval-prototype .ap-heading p{color:var(--ap-muted);font-size:13px;margin-top:6px}#approval-prototype .ap-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ap-line);background:var(--ap-panel);color:var(--ap-text);border-radius:5px;padding:8px 12px;white-space:nowrap}#approval-prototype .ap-primary{background:var(--ap-blue);border-color:var(--ap-blue);color:light-dark(#fff,#10213b)}#approval-prototype .ap-link{border:0;background:transparent;color:var(--ap-blue);padding:4px 5px;white-space:nowrap;font-size:13px}#approval-prototype .ap-danger{color:var(--ap-red)}#approval-prototype .ap-panel{background:var(--ap-panel);border:1px solid var(--ap-line);border-radius:7px;overflow:hidden}#approval-prototype .ap-panel-head{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--ap-line)}#approval-prototype .ap-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 18px}#approval-prototype .ap-toolbar input{flex:1;min-width:150px}#approval-prototype .ap-scroll{overflow-x:auto}#approval-prototype table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}#approval-prototype th{font-size:12px;font-weight:500;color:var(--ap-muted);background:var(--ap-bg);white-space:nowrap}#approval-prototype th,#approval-prototype td{padding:14px 12px;border-bottom:1px solid var(--ap-line);vertical-align:middle}#approval-prototype td:first-child,#approval-prototype th:first-child{padding-left:18px}#approval-prototype tr:last-child td{border-bottom:0}#approval-prototype td small{display:block;color:var(--ap-muted);font-size:11px;margin-top:5px}#approval-prototype .ap-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;background:var(--ap-bg);border-radius:4px;white-space:nowrap;color:var(--ap-muted)}#approval-prototype .ap-chip.live{background:light-dark(#eaf7f1,#183d32);color:var(--ap-green)}#approval-prototype .ap-chip.warn{background:light-dark(#fff5e1,#41351c);color:var(--ap-amber)}#approval-prototype .ap-chip.risk{color:var(--ap-red);background:light-dark(#fff0ef,#452b30)}#approval-prototype .ap-row-actions{display:flex;align-items:center;gap:2px}#approval-prototype .ap-foot{padding:13px 18px;font-size:12px;color:var(--ap-muted);border-top:1px solid var(--ap-line)}#approval-prototype .ap-banner{display:flex;align-items:flex-start;gap:10px;padding:13px 16px;margin-bottom:18px;background:var(--ap-soft);color:var(--ap-text);border-radius:5px;font-size:13px}#approval-prototype .ap-banner svg{color:var(--ap-blue);margin-top:2px}#approval-prototype .ap-banner small{display:block;color:var(--ap-muted);margin-top:4px}#approval-prototype .ap-tabs{display:flex;gap:16px;padding:0 18px;border-bottom:1px solid var(--ap-line)}#approval-prototype .ap-tab{border:0;background:transparent;padding:14px 0;color:var(--ap-muted);border-bottom:2px solid transparent}#approval-prototype .ap-tab.active{color:var(--ap-blue);border-bottom-color:var(--ap-blue)}#approval-prototype .ap-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#approval-prototype .ap-empty{padding:42px 18px;text-align:center;color:var(--ap-muted)}#approval-prototype .ap-overlay{position:absolute;inset:0;background:#0006;z-index:10;display:flex;align-items:flex-start;justify-content:center;padding:64px 20px 20px}#approval-prototype .ap-modal{background:var(--ap-panel);border-radius:8px;width:620px;max-width:100%;box-shadow:0 16px 80px #0003;max-height:calc(100% - 20px);overflow:auto}#approval-prototype .ap-modal>header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--ap-line)}#approval-prototype .ap-modal h3{font-size:17px;font-weight:600}#approval-prototype .ap-icon{border:0;background:transparent;color:var(--ap-muted);display:grid;place-items:center;padding:4px}#approval-prototype #ap-modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:16px}#approval-prototype .ap-modal footer{border-top:1px solid var(--ap-line);padding:15px 22px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}#approval-prototype .ap-field{display:flex;flex-direction:column;gap:7px;font-size:13px}#approval-prototype .ap-field small{color:var(--ap-muted)}#approval-prototype .ap-node{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ap-line)}#approval-prototype .ap-node>span{width:24px;height:24px;display:grid;place-items:center;background:var(--ap-soft);color:var(--ap-blue);border-radius:50%;font-size:12px}#approval-prototype .ap-node>div{flex:1}#approval-prototype .ap-node small{color:var(--ap-muted);display:block}#approval-prototype .ap-node select{max-width:180px}#approval-prototype .ap-check{display:flex;align-items:center;gap:8px;font-size:13px}#approval-prototype input[type=checkbox]{accent-color:var(--ap-blue);width:15px;height:15px}#approval-prototype .ap-toast{position:absolute;bottom:24px;left:24px;right:24px;background:var(--ap-text);color:var(--ap-panel);padding:12px 16px;border-radius:5px;z-index:12;font-size:13px}#approval-prototype .ap-warning{font-size:12px;color:var(--ap-amber)}#approval-prototype .ap-admin-cell{display:flex;gap:5px;flex-wrap:wrap}#approval-prototype .ap-dot{display:inline-block;width:6px;height:6px;background:var(--ap-red);border-radius:50%}#approval-prototype .ap-log{padding:14px 18px;border-bottom:1px solid var(--ap-line)}#approval-prototype .ap-log small{display:block;color:var(--ap-muted);margin-top:4px}
@media(max-width:760px){#approval-prototype .ap-layout{grid-template-columns:1fr}#approval-prototype .ap-sidebar{border-right:0;border-bottom:1px solid var(--ap-line);padding:12px}#approval-prototype .ap-role{max-width:300px;padding:0 0 8px}#approval-prototype #ap-nav{display:flex;gap:4px;flex-wrap:wrap}#approval-prototype .ap-nav-btn{width:auto;margin:0;padding:8px}#approval-prototype .ap-nav-label,#approval-prototype .ap-side-note{display:none}#approval-prototype .ap-main{padding:16px}#approval-prototype .ap-top{padding:12px 16px;flex-wrap:wrap}#approval-prototype .ap-demo{display:none}#approval-prototype .ap-heading{align-items:flex-start;flex-wrap:wrap}#approval-prototype .ap-overlay{padding-top:24px}#approval-prototype .ap-node{flex-wrap:wrap}}

<style>

#approval-prototype .ap-tree-top{display:flex;align-items:center;justify-content:space-between;padding:8px 7px;color:var(--ap-muted);font-size:12px}

#approval-prototype .ap-tree-line.selected{background:var(--ap-soft)}
#approval-prototype .ap-tree-name{display:flex;gap:7px;align-items:center;min-width:0;flex:1;padding:10px 5px;border:0;background:transparent;text-align:left;color:var(--ap-text);font-size:13px}
#approval-prototype .ap-tree-name svg{color:var(--ap-blue)}

#approval-prototype .ap-tree-leaf{display:flex;align-items:center;gap:7px;width:100%;padding:9px 7px;border:0;background:transparent;color:var(--ap-text);text-align:left;font-size:12px;border-radius:4px}

#approval-prototype .ap-form-area{background:var(--ap-bg);padding:24px;display:flex;flex-direction:column;gap:20px;border-top:1px solid var(--ap-line)}

<script>
(()=>{
const root=document.getElementById('approval-prototype');
const $=s=>root.querySelector(s);
let groups=['销售流程','商务流程','采购流程','行政流程','人事流程','财务流程'];
let groupMeta={},expanded=new Set(['销售流程']),activeApproval=1,managedSales='销售流程';
const people=['林悦','周宁','陈明','赵敏','王磊','李娜'];
let admins={'销售流程':['林悦'],'商务流程':['周宁'],'采购流程':['赵敏'],'行政流程':['李娜'],'人事流程':['李娜'],'财务流程':['周宁']};
let rows=[
{id:1,name:'销售合同审批',group:'销售流程',state:'已发布',version:4,draft:false,nodes:[['主管审批','王磊'],['合同复核','张伟（已离职）'],['合同归档','林悦']]},
{id:2,name:'报价折扣审批',group:'销售流程',state:'已发布',version:2,draft:true,nodes:[['折扣审核','张伟（已离职）'],['财务确认','周宁']]},
{id:3,name:'客户授信审批',group:'销售流程',state:'草稿',version:0,draft:true,nodes:[['授信复核','王磊']]},
{id:4,name:'供应商准入审批',group:'采购流程',state:'已发布',version:3,draft:false,nodes:[['资质审核','张伟（已离职）'],['采购确认','赵敏']]},
{id:5,name:'采购申请',group:'商务流程',state:'已停用',version:2,draft:false,nodes:[['采购主管','周宁']]},
{id:6,name:'费用报销审批',group:'财务流程',state:'已发布',version:6,draft:false,nodes:[['部门审批','王磊'],['财务审核','周宁']]},
{id:7,name:'用印申请',group:'行政流程',state:'已发布',version:2,draft:false,nodes:[['行政主管','李娜']]},
{id:8,name:'员工调岗审批',group:'人事流程',state:'回收站',version:1,draft:false,nodes:[['人事审核','李娜']]}
];
let role='super',view='apply',group='销售流程',query='',status='',person='',impactTab='templates',selected=new Set(),logs=[],savedFocus=null;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(text,action,cls='')=>`<button class="ap-button ${cls}" data-action="${action}">${text}</button>`;
function icons(){if(globalThis.lucide)lucide.createIcons();}
function canManage(g){return role==='super'||(role==='sales'&&g===managedSales&&(admins[g]||[]).includes('林悦'))}
function permitted(r){return canManage(r.group)}
function visible(){return rows.filter(permitted)}
function stash(){window.openai?.setWidgetState?.({modelContent:{revision:2,view,role,group},privateContent:{rows,admins,logs,groups,groupMeta,expanded:[...expanded],activeApproval,managedSales}})?.catch(()=>{});}
function toast(t){$('#ap-toast').textContent=t;$('#ap-toast').hidden=false;setTimeout(()=>$('#ap-toast').hidden=true,4000)}
function log(t){logs.unshift({text:t,time:'刚刚',actor:role==='super'?'陈明':'林悦'});stash()}
function risk(r){return r.nodes.some(n=>n[1].includes('离职'))}
function chip(r){return `<span class="ap-chip ${r.state==='已发布'?'live':r.state==='草稿'?'warn':''}">${r.state}</span>`}
function render(){
const navGroups=groups.filter(g=>!groupMeta[g]?.deleted&&(canManage(g)||!groupMeta[g]?.disabled));
$('#ap-nav').innerHTML=`<div class="ap-tree-top"><span>流程分类</span>${role==='super'?'<button class="ap-link" data-action="new-group" aria-label="新建流程">＋ 新建</button>':''}</div>`+navGroups.map(g=>{
const children=rows.filter(r=>r.group===g&&r.state!=='回收站'&&(canManage(g)||r.state==='已发布'));
return `<div class="ap-tree-group"><div class="ap-tree-line ${view==='list'&&group===g?'selected':''}"><button class="ap-tree-name" data-group-name="${escape(g)}">${icon('folder')}<span>${escape(g)}</span>${groupMeta[g]?.disabled?'<span class="ap-chip">停用</span>':''}</button><button class="ap-tree-toggle" data-expand="${escape(g)}" aria-label="${expanded.has(g)?'收起':'展开'}${escape(g)}" aria-expanded="${expanded.has(g)}" aria-controls="ap-children-${groups.indexOf(g)}"><span class="ap-count">${children.length}</span><span aria-hidden="true">${expanded.has(g)?'⌄':'›'}</span></button></div><div class="ap-tree-children" id="ap-children-${groups.indexOf(g)}" ${expanded.has(g)?'':'hidden'}>${children.map(r=>`<button class="ap-tree-leaf ${view==='apply'&&activeApproval===r.id?'active':''}" data-open-approval="${r.id}">${icon('git-branch')}<span>${escape(r.name)}</span>${r.state!=='已发布'?`<span class="ap-chip">${r.state}</span>`:''}</button>`).join('')||'<div class="ap-tree-empty">暂无可用审批</div>'}</div></div>`}).join('')+(role!=='user'?`<div class="ap-nav-label">管理工具</div>${[['impact','user-round-search','人员影响排查'],['recycle','archive-restore','回收站'],['logs','history','操作记录']].map(([v,i,t])=>`<button class="ap-nav-btn ${view===v?'active':''}" data-view="${v}">${icon(i)}${t}</button>`).join('')}`:'');
const allChildren=rows.filter(r=>!groupMeta[r.group]?.deleted&&r.state!=='回收站'&&(canManage(r.group)||(!groupMeta[r.group]?.disabled&&r.state==='已发布')));
$('#ap-nav').insertAdjacentHTML('afterbegin',`<div class="ap-tree-group"><div class="ap-tree-line ${view==='list'&&!group?'selected':''}"><button class="ap-tree-name" data-all-name="true">${icon('folder')}<span>全部流程</span></button><button class="ap-tree-toggle" data-expand="__all__" aria-label="${expanded.has('__all__')?'收起':'展开'}全部流程" aria-expanded="${expanded.has('__all__')}" aria-controls="ap-children-all"><span class="ap-count">${allChildren.length}</span><span aria-hidden="true">${expanded.has('__all__')?'⌄':'›'}</span></button></div><div class="ap-tree-children" id="ap-children-all" ${expanded.has('__all__')?'':'hidden'}>${allChildren.map(r=>`<button class="ap-tree-leaf ${view==='apply'&&activeApproval===r.id?'active':''}" data-open-approval="${r.id}">${icon('git-branch')}<span>${escape(r.name)}</span>${r.state!=='已发布'?`<span class="ap-chip">${r.state}</span>`:''}</button>`).join('')||'<div class="ap-tree-empty">暂无可用审批</div>'}</div></div>`);
$('#ap-scope').textContent=role==='super'?'点击流程名称管理，点击箭头展开审批':role==='sales'?'点击获授权的流程名称进入管理':'展开流程，选择审批并填写申请';
const current=rows.find(r=>r.id===activeApproval);
const titles={apply:current?.name||'发起审批',list:group||'全部流程',impact:'人员影响排查',admins:'流程管理员',recycle:'回收站',logs:'操作记录'};

const groupAction=b.dataset.action;
if(['edit-group','new-group','create-group','save-group','delete-group','confirm-delete-group'].includes(groupAction)){
if(role!=='super')return;
if(groupAction==='edit-group'||groupAction==='new-group'){groupModal(groupAction==='new-group');return}

const assigned=[...root.querySelectorAll('[data-group-admin]:checked')].map(el=>el.dataset.groupAdmin);
if(groupAction==='create-group'){groups.push(name);admins[name]=assigned;groupMeta[name]={disabled:false};group=name;expanded.add(name);view='list';log('创建流程：'+name)}else{

if(name!==old){groups=groups.map(g=>g===old?name:g);rows.forEach(r=>{if(r.group===old)r.group=name});delete admins[old];delete groupMeta[old];if(expanded.delete(old))expanded.add(name);if(managedSales===old)managedSales=name}

close();render();toast('流程设置已保存');return;
}
if(groupAction==='application-draft'){toast('已演示保存本次填写草稿');return}
if(groupAction==='application-submit'){if(!$('#ap-app-reason').value.trim()){toast('请填写申请事由');return}modal('提交审批',`<p>确认提交「${escape(rows.find(r=>r.id===activeApproval)?.name)}」？</p><p class="ap-warning">这是原型预览，不会创建真实申请。</p>`,btn('取消','close')+btn('确认提交','demo-submit','ap-primary'));return}
if(groupAction==='demo-submit'){close();toast('提交效果演示完成，未创建真实申请');return}
if(b.dataset.view){view=b.dataset.view;group=b.dataset.group||'';query='';status='';selected.clear();render();stash();return}
if(b.dataset.impact){impactTab=b.dataset.impact;render();return}
if(b.dataset.edit){edit(b.dataset.edit,b.dataset.node);return}
if(b.dataset.admin){const g=b.dataset.admin;modal('设置管理员 · '+g,`<p>所选人员可管理${g}下的全部审批。</p>${people.map(p=>`<label class="ap-check"><input type="checkbox" data-admin-person="${p}" ${admins[g].includes(p)?'checked':''}>${p}</label>`).join('')}<p class="ap-warning">此授权不包含总管理员权限，亦不改变审批节点的处理人。</p>`,btn('取消','close')+btn('保存授权',`grant:${g}`,'ap-primary'));return}
if(b.dataset.delete){const r=rows.find(r=>r.id==b.dataset.delete);modal('删除审批',`<p>确认将「${r.name}」移入回收站？</p><div class="ap-banner">${icon('archive')}不再允许新建申请；历史记录及正在处理的审批单保留，可从回收站恢复。</div>`,btn('取消','close')+btn('移入回收站',`delete:${r.id}`,'ap-danger'));return}
if(b.dataset.state){const r=rows.find(r=>r.id==b.dataset.state);if(r.state==='草稿'){edit(r.id);return}modal(r.state==='已停用'?'启用审批':'停用审批',`<p>${r.state==='已停用'?'启用后可继续发起':'停用后不再接受新申请，正在进行的审批不受影响'}：${r.name}</p>`,btn('取消','close')+btn('确认',`toggle:${r.id}`,'ap-primary'));return}
if(b.dataset.restore){const r=rows.find(r=>r.id==b.dataset.restore);r.state=r.previous||'已发布';log(`恢复审批：${r.name}`);render();toast('已恢复审批');return}
const a=b.dataset.action;if(!a)return;
if(a==='close'){close();return}
if(a==='filter'){query=$('#ap-search').value.trim();status=$('#ap-status').value;render();return}
if(a==='find'){person=$('#ap-person').value;selected.clear();render();return}
if(a==='replace'){replace();return}
if(a==='confirm-replace'){
const replacement=$('#ap-replacement').value;if(!replacement){$('#ap-replace-error').textContent='请选择接任人后再确认';return}
let count=0;rows.filter(permitted).forEach(r=>{r.nodes.forEach((n,i)=>{if(selected.has(`${r.id}:${i}`)&&n[1]===(person||'张伟（已离职）')){r.draftNodes??=JSON.parse(JSON.stringify(r.nodes));r.draftNodes[i][1]=replacement;r.draft=true;count++}})});
log(`批量替换：${person||'张伟（已离职）'} → ${replacement}，${count} 个节点，生成草稿`);close();render();toast(`已生成 ${count} 个节点的替换草稿；编辑对应审批可预览并发布`);return}
if(a.startsWith('grant:')){const g=a.slice(6);admins[g]=[...root.querySelectorAll('[data-admin-person]:checked')].map(el=>el.dataset.adminPerson);log(`管理员授权：${g} → ${admins[g].join('、')||'仅总管理员'}`);close();render();toast('流程管理员已更新');return}
if(a.startsWith('save:')||a.startsWith('publish:')){const r=rows.find(r=>r.id==a.split(':')[1]);const name=$('#ap-edit-name').value.trim();if(!name){toast('请填写审批名称');return}const nn=[...root.querySelectorAll('[data-node-person]')].map((el,i)=>[r.nodes[i][0],el.value]);r.name=name;if(a.startsWith('save:')){r.draftNodes=nn;r.draft=true;log(`保存草稿：${r.name}`)}else{r.nodes=nn;r.draftNodes=null;r.draft=false;r.version++;if(r.state!=='已停用')r.state='已发布';log(`发布审批：${r.name} v${r.version}`)}close();render();toast(a.startsWith('save:')?'草稿已保存，已发布版本继续生效':'新版本已发布，对之后发起的申请生效');return}
if(a.startsWith('delete:')){const r=rows.find(r=>r.id==a.split(':')[1]);r.previous=r.state;r.state='回收站';log(`删除审批：${r.name}，移入回收站`);close();render();toast('已移入回收站');return}
if(a.startsWith('toggle:')){const r=rows.find(r=>r.id==a.split(':')[1]);r.state=r.state==='已停用'?'已发布':'已停用';log(`${r.state==='已停用'?'停用':'启用'}审批：${r.name}`);close();render();return}
if(a==='new'){modal('新建审批',`<label class="ap-field">审批名称<input id="ap-new-name" placeholder="如：项目立项审批"></label><label class="ap-field">所属流程<select id="ap-new-group">${groups.filter(g=>canManage(g)&&!groupMeta[g]?.deleted).map(g=>`<option ${g===group?'selected':''}>${g}</option>`).join('')}</select></label><p class="ap-warning">创建后保存为草稿，配置表单和审批节点后再发布。</p>`,btn('取消','close')+btn('创建草稿','create','ap-primary'));return}
if(a==='create'){const name=$('#ap-new-name').value.trim();if(!name){toast('请填写审批名称');return}rows.unshift({id:Date.now(),name,group:$('#ap-new-group').value,state:'草稿',version:0,draft:true,nodes:[['主管审批','林悦']]});log(`新建审批草稿：${name}`);close();render();return}
if(a==='transfer'){modal('转交进行中的待办',`<div class="ap-banner">${icon('info')}转交仅更换此申请单的当前处理人，不修改审批模板及历史处理记录。</div><label class="ap-field">接任人<select id="ap-transfer-person"><option value="">请选择接任人</option>${people.map(p=>`<option>${p}</option>`).join('')}</select></label><label class="ap-field">转交原因<input id="ap-transfer-reason" placeholder="请填写交接原因"></label><p class="ap-warning">原型仅演示确认过程；正式版需校验待办最新状态并记录操作人。</p>`,btn('取消','close')+btn('确认转交','confirm-transfer','ap-primary'));return}
if(a==='confirm-transfer'){if(!$('#ap-transfer-person').value||!$('#ap-transfer-reason').value.trim()){toast('请选择接任人并填写转交原因');return}log('演示待办转交给 '+$('#ap-transfer-person').value);close();toast('已演示转交确认；未改动真实待办');return}
});
root.addEventListener('change',e=>{if(e.target.id==='ap-role'){role=e.target.value;view='apply';const r=rows.find(r=>r.id===activeApproval&&r.state==='已发布'&&!groupMeta[r.group]?.deleted&&!groupMeta[r.group]?.disabled)||rows.find(r=>r.state==='已发布'&&!groupMeta[r.group]?.deleted&&!groupMeta[r.group]?.disabled);activeApproval=r?.id;group=r?.group||'';if(group)expanded.add(group);selected.clear();render();stash()}if(e.target.dataset.select){e.target.checked?selected.add(e.target.dataset.select):selected.delete(e.target.dataset.select)}if(e.target.id==='ap-select-all'){root.querySelectorAll('[data-select]').forEach(el=>{el.checked=e.target.checked;el.checked?selected.add(el.dataset.select):selected.delete(el.dataset.select)})}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ap-search'){query=e.target.value.trim();status=$('#ap-status').value;render()}if(!$('#ap-overlay').hidden){if(e.key==='Escape')close();if(e.key==='Tab'){const els=[...$('#ap-overlay').querySelectorAll('button,input,select')].filter(el=>!el.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
$('#ap-modal-close').onclick=close;
const originalEdit=edit;edit=function(id,node){originalEdit(id,node);const r=rows.find(r=>r.id==id);if(r?.draftNodes)root.querySelectorAll('[data-node-person]').forEach((el,i)=>el.value=r.draftNodes[i][1])};
function restore(st){if(st?.privateContent?.rows){rows=st.privateContent.rows;admins=st.privateContent.admins||admins;logs=st.privateContent.logs||[]}if(st?.modelContent?.revision===2){const p=st.privateContent||{};view=st.modelContent.view||'apply';role=st.modelContent.role||'super';group=st.modelContent.group||'';groups=p.groups||groups;groupMeta=p.groupMeta||{};expanded=new Set(p.expanded||['销售流程']);activeApproval=p.activeApproval||1;managedSales=p.managedSales||'销售流程'}$('#ap-role').value=role;render()}
restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState)});
if(globalThis.Tweak){const style={compact:false};const tweak=new Tweak({container:root,onChange:()=>root.querySelectorAll('td').forEach(td=>td.style.paddingBlock=style.compact?'8px':'14px')});tweak.addToggle(style,'compact',{label:'紧凑表格'});}
})();
</script>
