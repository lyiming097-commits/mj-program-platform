server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/after-sales/assets/(.+\.mjs)$ {
        types { application/javascript mjs; }
        try_files /assets/$1 =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/after-sales/assets/(.+)$ {
        try_files /assets/$1 =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /after-sales {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location = /after-sales/open-manual.html {
        try_files /open-manual.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /after-sales/open-manual.js {
        try_files /open-manual.js =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /after-sales/round-share.png {
        try_files /round-share.png =404;
        expires 1h;
    }

    location /after-sales/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
